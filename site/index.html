<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Armani Crossword</title>
  <meta name="description" content="">
  <!-- Link previews (iMessage, WhatsApp, Slack, …). app.js mirrors config.json here at runtime, but unfurlers
       don't run JavaScript: a build/publish step should rewrite these (and <title>, the manifest) from config. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Armani Crossword">
  <meta property="og:description" content="">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Crossword">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="app.js">
</head>
<body>
  <div id="app" class="app" aria-busy="true">
    <noscript>
      <div class="noscript">This crossword needs JavaScript to run. Please enable it and reload the page.</div>
    </noscript>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
